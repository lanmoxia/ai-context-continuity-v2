[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "continuity"
version = "0.1.0"
description = "AI context continuity tool"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
continuity = "continuity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
